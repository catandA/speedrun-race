<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>速通比赛直播间</title>
  <!-- TRTC Web SDK v5 (CDN, 不打进包, 多镜像回退) -->
  <script>
  (function () {
    var urls = [
      'https://cdn.jsdelivr.net/npm/trtc-sdk-v5@5.19.1/trtc.min.js',
      'https://fastly.jsdelivr.net/npm/trtc-sdk-v5@5.19.1/trtc.min.js',
      'https://gcore.jsdelivr.net/npm/trtc-sdk-v5@5.19.1/trtc.min.js'
    ];
    function load(i) {
      if (i >= urls.length) { console.error('TRTC SDK 加载失败'); return; }
      var s = document.createElement('script');
      s.src = urls[i];
      s.onerror = function () { load(i + 1); };
      document.head.appendChild(s);
    }
    load(0);
  })();
  </script>
  <!-- pako (zlib, UserSig 压缩/解压用) -->
  <script>
  (function () {
    var urls = [
      'https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js',
      'https://fastly.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js'
    ];
    function load(i) {
      if (i >= urls.length) { console.error('pako 加载失败'); return; }
      var s = document.createElement('script');
      s.src = urls[i];
      s.onerror = function () { load(i + 1); };
      document.head.appendChild(s);
    }
    load(0);
  })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
